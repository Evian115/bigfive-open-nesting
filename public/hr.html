<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>来访者登记 · 人格测评</title>
  <link rel="stylesheet" href="/_nest/hr.css">
  <script src="/_nest/hr.js" defer></script>
</head>
<body>
  <main class="card" aria-label="人格测评登记">
    <div id="account" hidden><span id="account-name"></span><button id="logout" class="quiet">退出登录</button></div>
    <div id="loading" class="loading" role="status">正在检查登录状态…</div>
    <section id="login" hidden>
      <h1>人格测评登记</h1>
      <p class="muted">使用企业钉钉账号登录</p>
      <a id="login-link" class="login-entry" href="/auth/dingtalk/start">
        <span class="login-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8V5a1 1 0 0 1 1-1h3m8 0h3a1 1 0 0 1 1 1v3M4 16v3a1 1 0 0 0 1 1h3m8 0h3a1 1 0 0 0 1-1v-3M8 8h3v3H8zm5 0h3v3h-3zm-5 5h3v3H8zm5 0h3v3h-3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
        <strong>点击前往钉钉登录</strong>
        <span class="login-detail">支持账号登录或扫码授权</span>
      </a>
      <p class="footnote">授权完成后自动返回登记页面</p>
    </section>
    <form id="registration" hidden>
      <h2>来访者登记</h2>
      <p class="muted">姓名和电话先保存到钉钉，再生成测评链接。</p>
      <label for="name">姓名 <span>*</span></label>
      <input id="name" name="name" maxlength="80" pattern="\p{Unified_Ideograph}{1,80}" title="姓名只能填写中文汉字，不能包含空格、字母、数字或符号" placeholder="请输入纯中文姓名" autocomplete="off" required>
      <label for="phone">联系电话 <span>*</span></label>
      <div class="phone-field"><span>+86</span><input id="phone" name="phone" type="tel" inputmode="tel" maxlength="20" placeholder="请输入 11 位手机号" autocomplete="off" required></div>
      <button id="create" class="primary" type="submit">生成专属测评链接 <span>→</span></button>
      <p class="footnote">测评完成后自动更新该来访者的最新登记记录</p>
    </form>
    <section id="issued" hidden>
      <h2>测评链接已生成</h2>
      <p class="muted">复制完整链接，发送给对应来访者。</p>
      <label for="invite-url">专属测评链接</label>
      <textarea id="invite-url" readonly rows="4" spellcheck="false"></textarea>
      <p id="expiry" class="expiry"></p>
      <button id="copy" class="primary">复制完整链接 <span>↗</span></button>
      <button id="another" class="secondary">登记下一位来访者</button>
    </section>
    <p id="message" role="status" hidden></p>
  </main>
</body>
</html>
