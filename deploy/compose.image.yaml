name: bigfive-nesting-v2
services:
  nesting:
    image: ${NESTING_IMAGE:-bigfive-open-nesting:latest}
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8082:8082"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8082
      STATE_DIRECTORY: /app/data
    volumes:
      - nesting-tasks:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/_nest/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  nesting-tasks:
